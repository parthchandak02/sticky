[project]
name = "sticky-server"
version = "0.1.0"
description = "Server for a reTerminal Sticky e-paper device: Claude Code dashboard, voice notes, firmware updates"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pillow>=11.0",
  "python-multipart>=0.0.12",
  "rich>=13.9",
  "jinja2>=3.1.6",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27"]

[project.scripts]
sticky-server = "sticky_server.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server/sticky_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["server"]
