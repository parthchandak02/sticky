[project]
name = "sticky-server"
version = "0.1.0"
description = "Server for a reTerminal Sticky e-paper device: Claude Code dashboard, voice notes, firmware updates"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pillow>=11.0",
  "python-multipart>=0.0.12",
  "rich>=13.9",
  "jinja2>=3.1.6",
  "playwright>=1.65.2",
  "icalendar>=7.3.0",
  "recurring-ical-events>=3.8.2",
  "httpx>=0.28.1",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.14"]

[project.scripts]
sticky-server = "sticky_server.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# Only resolve package versions published at least 7 days ago (supply-chain safety).
exclude-newer = "7 days"

[tool.hatch.build.targets.wheel]
packages = ["server/sticky_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["server"]

[tool.ruff]
extend-exclude = ["firmware/freeink-sdk", "firmware/.pio"]

[tool.ruff.lint]
# Pyflakes plus pycodestyle errors. Broader style rules are not the CI gate.
# Firmware is not linted here; it is review-only and is not built in CI.
select = ["E4", "E7", "E9", "F"]
