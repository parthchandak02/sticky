; Sticky firmware: a thin client for sticky-server, on the FreeInk SDK.
;   pio run                 build
;   pio run -t upload       first install over USB (later updates arrive over the air)
;   pio device monitor      serial console (115200)
;
; Server URL and token for the first boot come from platformio.local.ini (not in git):
;   [local]
;   build_flags = '-DSTICKY_SERVER_URL="http://192.168.4.25:8787"' '-DSTICKY_TOKEN="..."'
; After that they live in NVS and can be changed from the serial console.

[platformio]
default_envs = sticky
extra_configs = platformio.local.ini

[local]
build_flags =

[env:sticky]
; pioarduino Arduino-ESP32 3.3.x on ESP-IDF 5.5.x, the version CrossMux ships on this board.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 6553600
monitor_speed = 115200
upload_speed = 460800
monitor_filters = esp32_exception_decoder

build_unflags = -std=gnu++11
build_flags =
  -std=gnu++2a
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DFREEINK_DEVICE_STICKY=1
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=3
  ${local.build_flags}

extra_scripts = pre:scripts/version.py

lib_deps =
  bblanchon/ArduinoJson@^7.2.0
  BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
  EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
  InputManager=symlink://freeink-sdk/libs/hardware/InputManager
  BatteryMonitor=symlink://freeink-sdk/libs/hardware/BatteryMonitor
  SDCardManager=symlink://freeink-sdk/libs/hardware/SDCardManager
  PowerManager=symlink://freeink-sdk/libs/hardware/PowerManager
  Microphone=symlink://freeink-sdk/libs/hardware/Microphone
  Buzzer=symlink://freeink-sdk/libs/hardware/Buzzer
  EnvironmentSensor=symlink://freeink-sdk/libs/hardware/EnvironmentSensor
  Imu=symlink://freeink-sdk/libs/hardware/Imu
